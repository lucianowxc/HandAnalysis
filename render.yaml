services:
  - type: web
    name: handanalysis-backend
    env: python
    plan: free
    autoDeploy: true
    buildCommand: apt-get update && apt-get install -y --no-install-recommends libgles2 libgl1 libglib2.0-0 libsm6 libxrender1 libxext6 && pip install --upgrade pip && pip install -e .[web,vision] matplotlib
    startCommand: uvicorn modern.webserver:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HANDANALYSIS_CORS_ALLOW_ORIGINS
        value: https://lucianowxc.github.io
      - key: HANDANALYSIS_MEDIAPIPE_MODEL_PATH
        value: /opt/render/project/src/models/hand_landmarker.task
