[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "handanalysis-modern"
version = "0.1.0"
description = "Modern Python 3 pipeline for monocular hand-pose analysis"
readme = "MODERNIZATION.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27"
]
vision = [
  "opencv-python>=4.8",
  "mediapipe>=0.10"
]
web = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
